name: Verify independent Trace distribution
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Clean installation without State source checkout
        run: npm ci --ignore-scripts
      - name: Typecheck, unit tests, production build
        run: npm run verify
      - name: Pack and test core-only and State adapter consumers
        run: npm run verify:install
